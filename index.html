<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Parroquia Católica San Juan Bautista — Horarios de misas, sacramentos, eventos y contacto." />
    <title>Parroquia San Juan Bautista — Apóstol</title>

    <!-- Datos estructurados: le dicen a Google que esto es una iglesia
         local en Maravatío, con su dirección y teléfono -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Church",
        "name": "Parroquia San Juan Bautista",
        "url": "https://parroquiasanjuanbautista.com/",
        "image": "https://parroquiasanjuanbautista.com/optimized/hero-1600.webp",
        "logo": "https://parroquiasanjuanbautista.com/icon-512.png",
        "telephone": "+52 447 478 2005",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Calle Madero s/n, Colonia Centro",
          "addressLocality": "Maravatío",
          "addressRegion": "Michoacán",
          "postalCode": "61250",
          "addressCountry": "MX"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 19.9009,
          "longitude": -100.4498
        },
        "sameAs": [
          "https://www.facebook.com/ParroquiaSanJuanBautistaMaravatioMich"
        ]
      }
    </script>

    <!-- Conexión anticipada a Google Fonts para que la tipografía no
         bloquee el primer render más de lo necesario -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- La foto de fondo del Hero es el LCP de la página: se precarga
         para que el navegador la pida desde el primer instante -->
    <link
      rel="preload"
      as="image"
      href="/optimized/hero-1600.webp"
      imagesrcset="/optimized/hero-480.webp 480w, /optimized/hero-960.webp 960w, /optimized/hero-1600.webp 1600w, /optimized/hero-2200.webp 2200w"
      imagesizes="100vw"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
